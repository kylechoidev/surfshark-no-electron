[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surfshark-ultralite"
version = "2.0.0"
description = "Ultra-lightweight Linux WireGuard client and daemon for Surfshark (No Electron)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41.0"]

[project.scripts]
surfshark-lite = "surfshark_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surfshark_lite = ["data/*.json", "web/static/*"]
